name: Preview cleanup

# Removes /ohsococo/pr-preview/pr-N/ from gh-pages for every PR that is no longer open.
#
# This lives apart from deploy.yml on purpose. GitHub keeps only one pending run per concurrency
# group and cancels the older one when a newer one queues, even with cancel-in-progress: false.
# In the shared gh-pages group a close run could cancel a pending deploy, or be cancelled by one,
# which is how stale previews were left behind. This workflow has its own group, and every run
# sweeps all closed PRs, so a cancelled or failed run is harmless: the next close or the daily
# schedule removes whatever it missed. The schedule only runs once this file is on the default branch.

on:
  pull_request:
    types: [closed]
    branches: [dev]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# pull-requests: write lets the job edit the "View preview" comment that deploy.yml posted, so it
# stops linking to a preview that no longer exists. The job never creates comments.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # A PR from a fork, or from Dependabot, runs with a read-only token, so its close run could only
    # fail. Such PRs never get a preview either. The daily schedule sweeps them with everything else.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    steps:
      # Only the published branch. PR code is never checked out or run here.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove previews of PRs that are not open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The PR whose close triggered this run. Empty on the schedule and on workflow_dispatch.
          CLOSED_PR: ${{ github.event.pull_request.number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # The marker marocchino/sticky-pull-request-comment writes for rossjrw/pr-preview-action's
          # `header: pr-preview`. It identifies the "View preview" comment deploy.yml posts on a PR.
          marker='<!-- Sticky Pull Request Commentpr-preview -->'

          # Removes every pr-preview/pr-<digits> directory whose PR is not open and commits the result.
          # The open list is fetched fresh on every call, so a PR reopened mid-run keeps its new preview.
          # Called as a plain statement, never inside `if`, so set -e stays in force inside it.
          # The PR number of every directory in the commit is appended to `removed`, and the open list
          # stays in `open` for mark_removed.
          remove_stale() {
            local open_json dirs dir n list=""
            # Open PRs to any base. If this fails, set -e stops the job here and nothing is removed.
            open_json=$(gh pr list --state open --limit 1000 --json number)
            jq -e 'type == "array"' <<<"$open_json" >/dev/null
            open=$(jq -r '.[].number' <<<"$open_json")
            echo "Open PRs: ${open//$'\n'/ }"

            dirs=$(git ls-tree -d --name-only HEAD -- pr-preview/)
            while IFS= read -r dir; do
              [[ "$dir" =~ ^pr-preview/pr-([0-9]+)$ ]] || continue
              n="${BASH_REMATCH[1]}"
              if grep -qxF -- "$n" <<<"$open"; then
                echo "keep   $dir (PR #$n is open)"
              else
                echo "remove $dir"
                git rm -r -q -- "$dir"
                list+="$n"$'\n'
              fi
            done <<<"$dirs"

            if git diff --cached --quiet; then
              return
            fi
            git commit -q -m "Remove previews of closed PRs"
            pending=1
            removed+="$list"
          }

          # Rewrites the "View preview" comment on PR #$1 to say the preview was removed, so it no longer
          # links to a URL that returns 404. Keeps the marker, so the deploy after a reopen updates this
          # same comment back to "View preview" instead of adding a second one. Never creates a comment.
          # Cosmetic, so every failure is a warning and the function always returns 0.
          mark_removed_on() {
            local n="$1" ids id body
            if ! ids=$(gh api --paginate "repos/$GH_REPO/issues/$n/comments" \
                --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id"); then
              echo "::warning::Could not list the comments on PR #$n, so its preview comment was not updated."
              return 0
            fi
            id="${ids%%$'\n'*}"
            if [ -z "$id" ]; then
              echo "PR #$n has no preview comment to update."
              return 0
            fi
            if ! [[ "$id" =~ ^[0-9]+$ ]]; then
              echo "::warning::The preview comment lookup on PR #$n returned '$id', not a comment ID."
              return 0
            fi
            body="[Preview cleanup]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)
          :---:
          Preview removed because the pull request was closed.
          $(date -u '+%Y-%m-%d %H:%M UTC')
          $marker"
            if ! gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" --silent -f body="$body"; then
              echo "::warning::Could not edit the preview comment $id on PR #$n."
              return 0
            fi
            echo "Marked the preview on PR #$n as removed (comment $id)."
          }

          # Updates the comment on every PR whose directory this run pushed as removed, plus the PR that
          # closed to trigger the run (its directory may have gone in an earlier run). Only called once
          # nothing is left to push, so a comment never says "removed" while the preview is still live.
          # The triggering PR may have been reopened while this run waited its turn: then it is in the open
          # list fetched by the last remove_stale call, its preview was kept, and its comment is left alone.
          mark_removed() {
            local n
            for n in $(printf '%s\n' "$removed" "$CLOSED_PR" | sort -un); do
              [[ "$n" =~ ^[0-9]+$ ]] || continue
              n=$((10#$n))
              if grep -qxF -- "$n" <<<"$open"; then
                echo "PR #$n is open again. Leaving its preview comment alone."
                continue
              fi
              mark_removed_on "$n"
            done
          }

          # pending is set while a commit is waiting to be pushed. A rebase keeps it; a reset clears it.
          # removed lists the PR numbers of the directories in that commit, and follows pending.
          pending=""
          removed=""
          open=""
          for attempt in 1 2 3 4 5; do
            remove_stale
            if [ -z "$pending" ]; then
              echo "No stale previews. Nothing to commit."
              mark_removed
              exit 0
            fi
            if git push origin HEAD:gh-pages; then
              echo "Stale previews removed."
              mark_removed
              exit 0
            fi
            echo "Push rejected (gh-pages moved, or no write access). Rebasing and retrying (attempt $attempt of 5)."
            if ! git pull --rebase origin gh-pages; then
              echo "Rebase conflicted: gh-pages changed a directory being removed. Starting over from the new tip."
              git rebase --abort || true
              git reset -q --hard FETCH_HEAD
              pending=""
              removed=""
            fi
          done
          echo "Could not push after 5 attempts."
          exit 1
