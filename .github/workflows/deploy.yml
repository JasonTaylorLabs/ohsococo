name: Deploy

# One GitHub Pages site, three kinds of build, all published from the gh-pages branch:
#   main        -> /ohsococo/                  (production)
#   dev         -> /ohsococo/dev/              (stable dev build)
#   PR into dev -> /ohsococo/pr-preview/pr-N/  (removed by preview-cleanup.yml when the PR closes)

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Every deploy pushes to gh-pages, so run them one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the base path for this build
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=/ohsococo/pr-preview/pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ]; then
            echo "base=/ohsococo" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "dev" ]; then
            echo "base=/ohsococo/dev" >> "$GITHUB_OUTPUT"
            echo "kind=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Deploys only run for main, dev, and PRs into dev." && exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.target.outputs.base }}
          NEXT_PUBLIC_SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}

      - name: Publish production
        if: steps.target.outputs.kind == 'production'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: out
          clean-exclude: |
            dev
            pr-preview
          force: false

      - name: Publish dev
        if: steps.target.outputs.kind == 'dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: out
          target-folder: dev
          force: false

      - name: Publish or remove PR preview
        if: steps.target.outputs.kind == 'preview'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: out
          preview-branch: gh-pages
          umbrella-dir: pr-preview
